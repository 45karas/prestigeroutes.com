services:
  - type: web
    name: prestigeroutes
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run render-build
    startCommand: npm run render-start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/prod.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: ADMIN_EMAIL
        value: admin@prestigeroutes.com
      - key: ADMIN_NAME
        value: Prestige Admin
      - key: ADMIN_PASSWORD
        value: PrestigeAdmin2026!
      - key: AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    disk:
      name: prestigeroutes-data
      mountPath: /var/data
      sizeGB: 1
